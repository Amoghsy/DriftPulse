version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: driftpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: driftpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driftpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # DriftPulse FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: driftpulse-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=driftpulse
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/driftpulse
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
