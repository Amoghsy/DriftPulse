services:
  - type: web
    name: driftpulse-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && alembic upgrade head
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        fromDatabase:
          name: driftpulse-db
          property: connectionString

databases:
  - name: driftpulse-db
    databaseName: driftpulse
    user: postgres
